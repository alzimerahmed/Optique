// Compose stability configuration
// Classes listed here are treated as stable by the Compose compiler
//
// Media/domain models: these are immutable-in-practice value types passed through
// Compose UI (timeline grid, albums, mediaview pager). Without this file the Compose
// compiler treats them as unstable (sealed classes with Parcelable/Uri fields),
// forcing every grid cell to recompose on any parent invalidation.
// NOTE: Album is deliberately NOT listed — AlbumsFlow.kt mutates `count`/`size`
// in-place while building cursor results, so marking it stable could skip
// recompositions. Revisit if those fields become `val`.
